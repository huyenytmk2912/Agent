name: atlas-core-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch pytest
      - run: pytest -q
      - run: python -m atlas.smoke --corpus tests/fixtures/tiny_corpus.jsonl --out-dir runs/ci-tiny --steps 3
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-ci-tiny-metrics
          path: runs/ci-tiny/metrics.json
