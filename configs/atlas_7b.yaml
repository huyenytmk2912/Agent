model:
  vocab_size: 49152
  d_model: 4096
  n_layers: 32
  n_heads: 32
  n_kv_heads: 8
  ffn_dim: 11008
  max_seq_len: 8192
  rope_theta: 500000.0
  norm_eps: 1.0e-5
  tie_embeddings: false
training:
  seed: 1337
  batch_size: 1
  grad_accum: 64
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 2000
  max_steps: 100000
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bf16
  checkpoint_every: 1000
  eval_every: 500
data:
  sequence_length: 8192
  workers: 4
system:
  output_dir: runs/atlas_7b
